        <button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">
          <span></span>
          <span></span>
          <span></span>

        <nav id="menu" class="menu">
          <ul>
            <li><a href="guilhem.html">Guilhem</a></li>

    <section class="hero" style="background-image: url('../assets/images/Palmiers.png');">

      <div class="scroll-arrow-container">
        <div class="scroll-arrow"></div>
      </div>

    <div id="menu-placeholder" style="display:none;"></div>

    <main class="page-section">
      <div class="container">
        <!-- Grille des éléments -->
        <div class="card-grid">
          <!-- <a href="#" class="card">
            <img src="../assets/images/35.png" alt="En 106">
  
          </a> -->
          <a href="#" class="card">
            <img src="../assets/images/FievreMinuit.png" alt="FievreMinuit">
            <!-- <div class="card-title">Fièvre Minuit</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/AzurCarmin.png" alt="AzurCarmin">
            <!-- <div class="card-title">Azur Carmin</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/DiscoBlues.png" alt="DiscoBlues">
            <!-- <div class="card-title">Disco Blues</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/SableduSoir.png" alt="SableduSoir">
            <!-- <div class="card-title">Sable du Soir</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/Vampire.png" alt="Vampire">
            <!-- <div class="card-title">Vampire</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/Grain_de_beaute_2.png" alt="Grain de Beauté">
            <!-- <div class="card-title">Grain de Beauté</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/Diner_aux_Chandelles_2.png" alt="Dîner aux Chandelles">
            <!-- <div class="card-title">Dîner aux Chandelles</div> -->
          </a>
          <a href="#" class="card">
            <img src="../assets/images/Pokemine_v2.png" alt="Pokémine">

          </a>
        </div>
      </div>
    </main>

    <!-- Fenêtre modale -->
    <div id="modal" class="modal hidden">
      <div class="modal-overlay"></div>
        <div class="modal-content">
          <button class="close-btn">&times;</button>
          <!-- <img id="modal-image" src="" alt="Image agrandie" /> -->

          <div class="modal-body">
              <!-- COLONNE GAUCHE : image + bouton + audio -->
              <div class="modal-left">
                <div class="image-wrapper">
                  <img id="modal-image" src="" alt="Image agrandie" />
                  <button id="play-btn" class="play-btn" aria-label="Lire la piste">
                    <svg id="play-icon" viewBox="0 0 24 24">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;">
                      <path d="M6 19h4V5H6zm8-14v14h4V5h-4z" />
                    </svg>
                  </button>
                </div>

                <!-- CONTROLES AUDIO -->
                <div class="audio-controls">
                  <!-- Progression -->
                  <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" step="0.1">
                    <span id="duration">0:00</span>
                  </div>

                  <!-- Volume -->
                  <div class="volume-container">
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
                  </div>
                </div>

                <!-- VISUALISATEUR -->
                <div id="visualizer">
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                </div>
              </div>

              <!-- COLONNE DROITE : description -->
              <div class="modal-description">
              </div>
            </div>
          </div>
        </div>

        <audio id="modal-audio" src=""></audio>
      </div>
    </div>

    <script src="../js/script.js"></script>

    <footer class="site-footer">
      &copy; 2026 Guilhem REBÉJAC - Tous droits réservés.
    </footer>
  </body>
</html>
